<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI/CD Pipeline Demo</title>
<style>
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #f2f5fa; color: #14213d; margin: 0; }
  main { max-width: 640px; margin: 0 auto; padding: 72px 20px; }
  h1 { font-size: 2.4rem; line-height: 1.15; margin: 0 0 14px; }
  p { color: #55627a; font-size: 1.1rem; }
  .badge { display: inline-block; background: #0f766e; color: #fff; padding: 6px 14px; border-radius: 8px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Deployed automatically with CI/CD</h1>
  <p>This page was pushed to GitHub and deployed to Amazon S3 by a GitHub Actions pipeline. No manual upload.</p>
  <span class="badge">Version 1</span>
</main>
</body>
</html>
